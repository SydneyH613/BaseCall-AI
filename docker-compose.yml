services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: basecall
      POSTGRES_PASSWORD: basecall
      POSTGRES_DB: basecall
    ports:
      - "5432:5432"
    volumes:
      - basecall_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basecall"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://basecall:basecall@db:5432/basecall
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  basecall_pgdata:
